<!DOCTYPE html>
<html>

<head>
  <title>Flat Screen VR Casino</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
</head>

<body>
  <a-scene>

    <!-- Assets -->
    <a-assets>
      <!-- Game 1 Assets -->
      <video id="dealIn" src="Game1/DealIn.mp4" muted playsinline></video>
      <video id="hitLoseVid" src="Game1/Hit.mp4" muted playsinline></video>
      <video id="standLoseVid" src="Game1/Stand.mp4" muted playsinline></video>

      <!-- Game 2 Assets -->
      <video id="dealIn2" src="Game2/DealIn.mp4" muted playsinline></video>
      <video id="hitWinVid2" src="Game2/Hit.mp4" muted playsinline></video>
      <video id="standLoseVid2" src="Game2/Stand.mp4" muted playsinline></video>

      <!-- Game 3 Assets -->
      <video id="dealIn3" src="Game3/DealIn.mp4" muted playsinline></video>
      <video id="hit1" src="Game3/Hit1.mp4" muted playsinline></video>
      <video id="hitAfterHit1" src="Game3/HitAfterHit1.mp4" muted playsinline></video>
      <video id="stand1" src="Game3/Stand1.mp4" muted playsinline></video>
      <video id="standAfterHit1" src="Game3/StandAfterHit1.mp4" muted playsinline></video>


      <!-- Background Music -->
      <audio id="bgMusic" src="casino_bg.mp3" loop></audio>

      <!--Cards Game 1-->
      <img id="card4C" src="cards/4C.png">
      <img id="card9C" src="cards/9C.png">
      <img id="card7C" src="cards/7C.png">
      <img id="card3S" src="cards/3S.png">
      <img id="cardJC" src="cards/JC.png">
      <img id="cardBack" src="cards/red_back.png">

      <!--Cards Game 2-->
      <img id="card8H" src="cards/8H.png">
      <img id="card10D" src="cards/10D.png">
      <img id="card9D" src="cards/9D.png">
      <img id="card8C" src="cards/8C.png">
      <img id="card4S" src="cards/4S.png">


      <!--Cards Game 3-->
      <img id="card5D" src="cards/5D.png">
      <img id="cardKD" src="cards/KD.png">
      <img id="cardJS" src="cards/JS.png">
      <img id="cardQC" src="cards/QC.png">
      <img id="card5S" src="cards/5S.png">
      <img id="card3D" src="cards/3D.png">

    </a-assets>

    <!-- Camera with gaze cursor -->
    <a-entity camera look-controls wasd-controls-enabled="false" position="0 1.6 0">
      <a-cursor fuse="true" fuse-timeout="1500" raycaster="objects: .clickable" material="color: yellow; shader: flat"
        geometry="radiusInner: 0.01; radiusOuter: 0.02">
      </a-cursor>
    </a-entity>

    <!-- Video Screen -->
    <a-plane id="screen" position="0 1.6 -1.1" width="2.5" height="1.4" material="shader: flat" raycastable="false">
    </a-plane>

    <!-- Buttons -->
    <a-box id="betButton" class="clickable" position="0 1.2 -1" width="0.6" height="0.25" depth="0.05" color="green">
      <a-text value="BET" align="center" position="0 0 0.03"></a-text>
    </a-box>

    <a-box id="hitButton" class="clickable" position="-0.5 1.2 -1" width="0.6" height="0.25" depth="0.05" color="red"
      visible="false">
      <a-text value="HIT" align="center" position="0 0 0.03"></a-text>
    </a-box>

    <a-box id="standButton" class="clickable" position="0.5 1.2 -1" width="0.6" height="0.25" depth="0.05" color="blue"
      visible="false">
      <a-text value="STAND" align="center" position="0 0 0.03"></a-text>
    </a-box>

    <a-text id="resultText" value="" align="center" color="yellow" width="4" position="0 1.0 -1" visible="false">
    </a-text>

    <a-plane id="playerCard1" position="-0.9 1.55 -1" width="0.25" height="0.35" visible="false"></a-plane>

    <a-plane id="playerCard2" position="-0.6 1.55 -1" width="0.25" height="0.35" visible="false"></a-plane>

    <a-plane id="playerCard3" position="-0.3 1.55 -1" width="0.25" height="0.35" visible="false"></a-plane>

    <a-plane id="playerCard4" position="-1.2 1.55 -1" width="0.25" height="0.35" visible="false"></a-plane>


    <a-plane id="dealerCard1" position="-0.9 2 -1" width="0.25" height="0.35" visible="false"></a-plane>

    <a-plane id="dealerCard2" position="-0.6 2 -1" width="0.25" height="0.35" visible="false"></a-plane>

    <a-plane id="dealerCard3" position="-0.3 2 -1" width="0.25" height="0.35" visible="false"></a-plane>


    <script>
      //Cards
      const playerCard1 = document.querySelector('#playerCard1');
      const playerCard2 = document.querySelector('#playerCard2');
      const playerCard3 = document.querySelector('#playerCard3');

      const dealerCard1 = document.querySelector('#dealerCard1');
      const dealerCard2 = document.querySelector('#dealerCard2');
      const dealerCard3 = document.querySelector('#dealerCard3');



      //Bg Music
      const bgMusic = document.querySelector('#bgMusic');
      let bgStarted = false;

      const screen = document.querySelector('#screen');

      //Game 1
      const dealIn = document.querySelector('#dealIn');
      const hitLoseVid = document.querySelector('#hitLoseVid');
      const standLoseVid = document.querySelector('#standLoseVid');

      // Game 2
      const dealIn2 = document.querySelector('#dealIn2');
      const hitWinVid2 = document.querySelector('#hitWinVid2');
      const standLoseVid2 = document.querySelector('#standLoseVid2');


      // Game 3
      const dealIn3 = document.querySelector('#dealIn3');
      const hit1 = document.querySelector('#hit1');
      const hitAfterHit1 = document.querySelector('#hitAfterHit1');
      const stand1 = document.querySelector('#stand1');
      const standAfterHit1 = document.querySelector('#standAfterHit1');

      let playerHits = false;

      //Buttons
      const betBtn = document.querySelector('#betButton');
      const hitBtn = document.querySelector('#hitButton');
      const standBtn = document.querySelector('#standButton');
      const resultText = document.querySelector('#resultText');

      //game switch code in bet button
      let gameOrder = [1, 2, 3];
      let gameIndex = 0;

      function shuffleGames() {

        for (let i = gameOrder.length - 1; i > 0; i--) {

          const j = Math.floor(Math.random() * (i + 1));
          [gameOrder[i], gameOrder[j]] = [gameOrder[j], gameOrder[i]];

        }

      }

      function showResult(message) {

        resultText.setAttribute('value', message);
        resultText.setAttribute('visible', true);

      }

      function hideResult() {

        resultText.setAttribute('visible', false);

      }

      shuffleGames();
      let currentGame = 1;


      function playVideo(video) {

        [
          dealIn, hitLoseVid, standLoseVid,
          dealIn2, hitWinVid2, standLoseVid2,
          dealIn3, hit1, hitAfterHit1, stand1, standAfterHit1
        ].forEach(v => {
          v.pause();
          v.currentTime = 0;
        });



        screen.setAttribute('material', {
          shader: 'flat',
          src: `#${video.id}`
        });

        video.play();

      }


      // gaze hover animation
      function addGazeFeedback(button) {
        button.addEventListener('mouseenter', () => {
          button.setAttribute('animation__scale', {
            property: 'scale',
            to: '1.2 1.2 1.2',
            dur: 1500,
            easing: 'linear'
          });
        });

        button.addEventListener('mouseleave', () => {
          button.removeAttribute('animation__scale');
          button.setAttribute('scale', '1 1 1');
        });
      }

      [betBtn, hitBtn, standBtn].forEach(addGazeFeedback);


      // BET
      betBtn.addEventListener('click', () => {

        resultText.setAttribute('visible', false);

        if (!bgStarted) {
          bgMusic.volume = 0.5;   // adjust loudness
          bgMusic.play().catch(() => { });
          bgStarted = true;
        }

        [playerCard1, playerCard2, playerCard3, playerCard4, dealerCard1, dealerCard2, dealerCard3].forEach(card => {
          card.setAttribute('visible', false);
        });

        betBtn.setAttribute('visible', false);

        // alternate games
        currentGame = gameOrder[gameIndex];
        gameIndex++;

        if (gameIndex >= gameOrder.length) {

          shuffleGames();
          gameIndex = 0;

        }

        if (currentGame === 1) {
          playVideo(dealIn);

          //showResult("game 1!")

          dealIn.onended = () => {

            playerCard1.setAttribute('material', 'src:#card4C');
            playerCard2.setAttribute('material', 'src:#card9C');

            dealerCard1.setAttribute('material', 'src:#card7C');
            dealerCard2.setAttribute('material', 'src:#cardBack');

            playerCard1.setAttribute('visible', true);
            playerCard2.setAttribute('visible', true);

            dealerCard1.setAttribute('visible', true);
            dealerCard2.setAttribute('visible', true);

            hitBtn.setAttribute('visible', true);
            standBtn.setAttribute('visible', true);

          };


        } else if (currentGame === 3) {

          playerHits = false;

          playVideo(dealIn3);

          dealIn3.onended = () => {
            playerCard1.setAttribute('material', 'src:#card5D');
            playerCard2.setAttribute('material', 'src:#cardJS');

            dealerCard1.setAttribute('material', 'src:#cardKD');
            dealerCard2.setAttribute('material', 'src:#cardBack');

            playerCard1.setAttribute('visible', true);
            playerCard2.setAttribute('visible', true);

            dealerCard1.setAttribute('visible', true);
            dealerCard2.setAttribute('visible', true);

            hitBtn.setAttribute('visible', true);
            standBtn.setAttribute('visible', true);
          };

        }
        else {

          playVideo(dealIn2);

          dealIn2.onended = () => {

            playerCard1.setAttribute('material', 'src:#card8H');
            playerCard2.setAttribute('material', 'src:#card9D');

            dealerCard1.setAttribute('material', 'src:#card10D');
            dealerCard2.setAttribute('material', 'src:#cardBack');

            playerCard1.setAttribute('visible', true);
            playerCard2.setAttribute('visible', true);

            dealerCard1.setAttribute('visible', true);
            dealerCard2.setAttribute('visible', true);

            hitBtn.setAttribute('visible', true);
            standBtn.setAttribute('visible', true);

          };

        }

      });

      // HIT
      hitBtn.addEventListener('click', () => {

        hitBtn.setAttribute('visible', false);
        standBtn.setAttribute('visible', false);

        if (currentGame === 1) {

          playVideo(hitLoseVid);


          hitLoseVid.onended = () => {

            playerCard3.setAttribute('material', 'src:#cardJC');
            playerCard3.setAttribute('visible', true);

            dealerCard2.setAttribute('material', 'src:#card3S');

            showResult("Player Lose!");
            resetGame();

          };

        } else if (currentGame === 3) {

          if (!playerHits) {

            playerHits = true;

            playVideo(hit1);

            hit1.onended = () => {
              playerCard3.setAttribute('material', 'src:#card5S');
              playerCard3.setAttribute('visible', true);

              hitBtn.setAttribute('visible', true);
              standBtn.setAttribute('visible', true);
            };

          } else {

            playVideo(hitAfterHit1);
            hitAfterHit1.onended = () => {
              playerCard4.setAttribute('material', 'src:#card3D');
              playerCard4.setAttribute('visible', true);

              dealerCard2.setAttribute('material', 'src:#cardQC');

              showResult("Player Lose!");
              resetGame();

            };

          }

        }
        else {

          playVideo(hitWinVid2);

          hitWinVid2.onended = () => {

            playerCard3.setAttribute('material', 'src:#card4S');
            playerCard3.setAttribute('visible', true);

            dealerCard2.setAttribute('material', 'src:#card8C');

            showResult("Player Win!");
            resetGame();

          };

        }

      });

      // STAND
      standBtn.addEventListener('click', () => {

        hitBtn.setAttribute('visible', false);
        standBtn.setAttribute('visible', false);

        if (currentGame === 1) {

          playVideo(standLoseVid);

          standLoseVid.onended = () => {

            dealerCard2.setAttribute('material', 'src:#card3S');
            dealerCard3.setAttribute('material', 'src:#cardJC');
            dealerCard3.setAttribute('visible', true);
            showResult("Player Lose!");
            resetGame();

          };

        } else if (currentGame === 3) {

          if (!playerHits) {

            playVideo(stand1);
            stand1.onended = () => {
              dealerCard2.setAttribute('material', 'src:#cardQC');

              showResult("Player Lose!");
              resetGame();

            };

          } else {

            playVideo(standAfterHit1);

            standAfterHit1.onended = () => {
              dealerCard2.setAttribute('material', 'src:#cardQC');


              showResult("Player tie!");
              resetGame();

            };

          }

        }
        else {

          playVideo(standLoseVid2);

          standLoseVid2.onended = () => {

            dealerCard2.setAttribute('material', 'src:#card8C');

            showResult("Player Lose!");
            resetGame();

          };

        }

      });


      function resetGame() {

        betBtn.setAttribute('visible', true);
      }

    </script>

  </a-scene>
</body>

</html>
